<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Preview — Pengelompokan Paket Data | Dinas Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: 37 99 235;
      --primary-hover: 29 78 216;
      --secondary: 6 182 212;
      --accent: 139 92 246;
      --success: 22 163 74;
      --warning: 245 158 11;
      --danger: 220 38 38;
      --bg: 248 250 252;
      --surface: 255 255 255;
      --text: 15 23 42;
      --muted: 100 116 139;
      --border: 226 232 240;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Inter, system-ui, sans-serif;
      background: rgb(var(--bg));
      color: rgb(var(--text));
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1120px; margin: 0 auto; padding: 32px 16px; }
    .back {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; color: rgb(var(--muted));
      text-decoration: none; margin-bottom: 20px;
    }
    .back:hover { color: rgb(var(--primary)); }
    .hero {
      background: rgb(var(--primary));
      border-radius: 16px;
      padding: 24px;
      color: #fff;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.05), 0 8px 24px -4px rgb(15 23 42 / 0.08);
      margin-bottom: 24px;
    }
    .hero h1 { font-size: 30px; font-weight: 700; letter-spacing: -0.02em; }
    .hero p { color: rgba(255,255,255,0.8); margin-top: 4px; font-size: 14px; }

    .note {
      background: rgb(var(--accent) / 0.08);
      border: 1px solid rgb(var(--accent) / 0.25);
      color: rgb(var(--text));
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 13px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .note strong { color: rgb(139 92 246); }
    .note code {
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--border));
      padding: 1px 6px; border-radius: 6px; font-size: 12px;
    }

    .sections { display: flex; flex-direction: column; gap: 32px; }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgb(var(--border));
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-bar {
      width: 4px;
      height: 18px;
      border-radius: 999px;
      background: rgb(var(--primary));
      flex-shrink: 0;
    }
    .section-count {
      font-size: 12px;
      font-weight: 500;
      color: rgb(var(--muted));
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }
    @media (min-width: 768px) { .grid { grid-template-columns: 1fr 1fr 1fr; } }
    @media (min-width: 1024px) { .grid { grid-template-columns: 1fr 1fr 1fr 1fr; } }

    .card {
      position: relative;
      background: rgb(var(--surface));
      border: 1px solid rgb(var(--border));
      border-radius: 16px;
      box-shadow: 0 1px 2px rgb(15 23 42 / 0.05), 0 8px 24px -4px rgb(15 23 42 / 0.08);
      padding: 14px;
      display: flex; align-items: center; gap: 12px;
      text-decoration: none; color: inherit;
      transition: transform .15s, box-shadow .15s, border-color .15s;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgb(var(--primary) / 0.3);
      box-shadow: 0 12px 32px -8px rgb(37 99 235 / 0.18);
    }
    .logo {
      width: 48px; height: 48px; flex-shrink: 0;
      border-radius: 12px; overflow: hidden;
      background: rgb(var(--primary) / 0.1);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; color: rgb(var(--primary)); font-size: 18px;
      box-shadow: 0 0 0 1px rgb(var(--border));
    }
    .meta { flex: 1; min-width: 0; }
    .badges { display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .hot {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em;
      background: rgb(var(--warning) / 0.15); color: rgb(var(--warning));
      padding: 2px 6px; border-radius: 999px;
    }
    .prov { font-size: 10px; color: rgb(var(--muted)); }
    .name { font-weight: 600; font-size: 14px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sub { font-size: 12px; color: rgb(var(--muted)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .price-row { margin-top: 6px; display: flex; align-items: center; gap: 8px; }
    .price { color: rgb(var(--primary)); font-weight: 700; font-size: 14px; }
    .strike { font-size: 10px; color: rgb(var(--muted)); text-decoration: line-through; }
    .off {
      font-size: 10px; font-weight: 700;
      background: rgb(var(--danger) / 0.1); color: rgb(var(--danger));
      padding: 2px 6px; border-radius: 999px;
    }
    .sold { font-size: 10px; color: rgb(var(--muted)); margin-top: 4px; }

    .empty {
      background: rgb(var(--surface));
      border: 1px dashed rgb(var(--border));
      border-radius: 16px;
      padding: 64px 16px;
      text-align: center;
      color: rgb(var(--muted));
      font-weight: 500;
    }
    .empty .icon { font-size: 36px; margin-bottom: 12px; }
  </style>
</head>
<body>
  <main class="container">
    <a class="back" href="#">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Kembali
    </a>

    <div class="hero">
      <h1>Paket Data XL</h1>
      <p>8 produk tersedia di kategori Paket Data</p>
    </div>

    <div class="note">
      <strong>Preview UI</strong> — halaman <code>/paket-data/xl</code>.
      Semua grup tampil bertumpuk di satu halaman. File ini mockup, bukan fitur live.
    </div>

    <div class="sections" id="sections"></div>
  </main>

  <script>
    const GROUPS = [
      { id: 'malam', name: 'Paket Malam' },
      { id: 'bulanan', name: 'Paket Bulanan' },
      { id: 'roaming', name: 'Paket Roaming' },
      { id: 'lainnya', name: 'Lainnya' },
    ]

    const PRODUCTS = [
      { id: 1, name: 'XL Malam 2GB', kuota: '2 GB', masa: '1 Hari', price: 5500, jual: 7000, sold: 128, group: 'malam', hot: true },
      { id: 2, name: 'XL Malam 5GB', kuota: '5 GB', masa: '1 Hari', price: 8500, jual: 10000, sold: 86, group: 'malam' },
      { id: 3, name: 'XL Malam 10GB', kuota: '10 GB', masa: '3 Hari', price: 15000, jual: 15000, sold: 41, group: 'malam' },
      { id: 4, name: 'XL Combo 15GB', kuota: '15 GB', masa: '30 Hari', price: 45000, jual: 52000, sold: 210, group: 'bulanan', hot: true },
      { id: 5, name: 'XL Combo 30GB', kuota: '30 GB', masa: '30 Hari', price: 72000, jual: 85000, sold: 97, group: 'bulanan' },
      { id: 6, name: 'XL Combo 50GB', kuota: '50 GB', masa: '30 Hari', price: 98000, jual: 98000, sold: 33, group: 'bulanan' },
      { id: 7, name: 'XL Roaming ASEAN 3GB', kuota: '3 GB', masa: '7 Hari', price: 65000, jual: 75000, sold: 12, group: 'roaming' },
      { id: 8, name: 'XL Extra Kuota 1GB', kuota: '1 GB', masa: '7 Hari', price: 4000, jual: 4000, sold: 19, group: 'lainnya' },
    ]

    const fmt = (n) => 'Rp ' + n.toLocaleString('id-ID')

    function cardHtml(p) {
      const disc = p.price < p.jual
      const pct = disc ? Math.round(((p.jual - p.price) / p.jual) * 100) : 0
      return `
        <div class="card">
          <div class="logo">X</div>
          <div class="meta">
            <div class="badges">
              ${p.hot ? '<span class="hot">🔥 Terlaris</span>' : ''}
              <span class="prov">XL</span>
            </div>
            <div class="name">${p.name}</div>
            <div class="sub">${p.kuota} • ${p.masa}</div>
            <div class="price-row">
              <span class="price">${fmt(p.price)}</span>
              ${disc ? `<span class="strike">${fmt(p.jual)}</span><span class="off">-${pct}%</span>` : ''}
            </div>
            <div class="sold">Terjual ${p.sold}</div>
          </div>
        </div>
      `
    }

    const root = document.getElementById('sections')
    const html = GROUPS.map((g) => {
      const list = PRODUCTS.filter((p) => p.group === g.id)
      if (!list.length) return ''
      return `
        <section>
          <div class="section-head">
            <h2 class="section-title"><span class="section-bar"></span>${g.name}</h2>
            <span class="section-count">${list.length} produk</span>
          </div>
          <div class="grid">
            ${list.map(cardHtml).join('')}
          </div>
        </section>
      `
    }).join('')

    root.innerHTML = html || `
      <div class="empty">
        <div class="icon">📦</div>
        <p>Belum ada produk</p>
      </div>
    `
  </script>
</body>
</html>
